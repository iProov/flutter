group 'com.iproov.flutter_sdk_plugin'
version '7.0.0'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

def pluginProjectDir = projectDir

// Versions are centralized in sdk-versions.properties at the project root.
def sdkVersions = new Properties()
new File(projectDir.parentFile, "sdk-versions.properties").withInputStream { sdkVersions.load(it) }

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "${pluginProjectDir}/repo" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 36
    namespace "com.iproov.flutter_sdk_plugin"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 26
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.iproov.sdk:iproov:${sdkVersions['ANDROID_VERSION']}"
}
